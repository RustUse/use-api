[[package]]
name = "use-api"
release = true
version_group = "rustuse-api"
changelog_update = true
changelog_path = "./CHANGELOG.md"
changelog_include = [
    "use-rest",
    "use-openapi",
    "use-graphql",
    "use-grpc",
    "use-rpc",
    "use-endpoint",
    "use-api-route",
    "use-api-version",
    "use-pagination",
    "use-cursor",
    "use-rate-limit",
    "use-api-error",
    "use-api-key",
    "use-webhook",
    "use-idempotency",
    "use-content-negotiation",
    "use-api-auth",
    "use-api-request",
    "use-api-response",
    "use-api-schema",
    "use-api-param",
    "use-api-header",
    "use-api-media-type",
    "use-api-deprecation",
    "use-api-resource",
    "use-api-operation",
]

[changelog]
header = """# Changelog

## Unreleased
"""
protect_breaking_commits = true
sort_commits = "oldest"
commit_parsers = [
    { message = "^feat(?:\\([^)]+\\))?!?: .+", group = "Added" },
    { message = "^fix(?:\\([^)]+\\))?!?: .+", group = "Fixed" },
    { message = "^security(?:\\([^)]+\\))?!?: .+", group = "Security" },
    { message = "^(?:refactor|perf|change)(?:\\([^)]+\\))?!?: .+", group = "Changed" },
    { message = "^docs(?:\\([^)]+\\))?!?: .+", group = "Documentation" },
    { message = "^(?:build|ci|chore|deps|test)(?:\\([^)]+\\))?!?: .+", group = "Tooling" },
    { footer = "^changelog: ?ignore$", skip = true },
    { message = "^.*", group = "Changed" },
]
