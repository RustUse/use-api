name: Publish Readiness

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

jobs:
    release-readiness:
        name: Release Readiness Checks
        runs-on: ubuntu-latest
        env:
            FOCUSED_CRATES: >-
                use-rest use-openapi use-graphql use-grpc use-rpc use-endpoint use-api-route use-api-version use-pagination use-cursor use-rate-limit use-api-error use-api-key use-webhook use-idempotency use-content-negotiation use-api-auth use-api-request use-api-response use-api-schema use-api-param use-api-header use-api-media-type use-api-deprecation use-api-resource use-api-operation
        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Install stable Rust toolchain
              uses: actions-rust-lang/setup-rust-toolchain@v1
              with:
                  rustflags: ""
                  cache-workspaces: |
                      . -> target

            - name: Check examples with all features enabled
              run: cargo check --workspace --all-features --examples

            - name: Test workspace without default features
              run: cargo test --workspace --no-default-features

            - name: Dry-run publish focused crates
              run: |
                  for crate in $FOCUSED_CRATES; do
                    cargo package --list -p "$crate"
                    cargo publish --dry-run --allow-dirty -p "$crate"
                  done