name: Facade Publish Readiness

"on":
    workflow_dispatch:
        inputs:
            registry-ready:
                description: Confirm that matching focused-crate versions are live on crates.io
                required: true
                type: boolean

permissions:
    contents: read

jobs:
    facade-release-readiness:
        if: ${{ inputs.registry-ready }}
        name: Facade Publish Dry Run
        runs-on: ubuntu-latest
        env:
            FOCUSED_CRATES: >-
                use-rest use-openapi use-graphql use-grpc use-rpc use-endpoint use-api-route use-api-version use-pagination use-cursor use-rate-limit use-api-error use-api-key use-webhook use-idempotency use-content-negotiation use-api-auth use-api-request use-api-response use-api-schema use-api-param use-api-header use-api-media-type use-api-deprecation use-api-resource use-api-operation
        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Install stable Rust toolchain
              uses: actions-rust-lang/setup-rust-toolchain@v1
              with:
                  rustflags: ""
                  cache-workspaces: |
                      . -> target

            - name: Confirm focused crates are visible on crates.io
              run: |
                  for crate in $FOCUSED_CRATES; do
                    curl --fail --silent --show-error "https://crates.io/api/v1/crates/${crate}" > /dev/null
                  done

            - name: List packaged facade files
              run: cargo package --list -p use-api

            - name: Dry-run publish use-api
              run: cargo publish --dry-run --allow-dirty -p use-api
